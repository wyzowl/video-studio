<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"number","type":"string","label":"Number (it counts up to this; keep any $, £ or commas)","default":"48"},
    {"id":"unit","type":"string","label":"Unit after the number","default":"%"},
    {"id":"label","type":"string","label":"What the number is","default":"of customers chose the yearly plan"},
    {"id":"comparison","type":"string","label":"Comparison (optional)","default":"Up from 35% last quarter"},
    {"id":"source","type":"string","label":"Source","default":"Source · Sales data, 2026"},
    {"id":"side","type":"enum","label":"Side","default":"left","options":[{"value":"left","label":"Left"},{"value":"right","label":"Right"}]},
    {"id":"duration","type":"number","label":"Length","default":6,"min":2,"step":0.1,"unit":"s"},
    {"id":"card","type":"color","label":"Card","default":"#F6F3EA"},
    {"id":"ink","type":"color","label":"Text","default":"#1E1E1E"},
    {"id":"muted","type":"color","label":"Muted text","default":"#5F5E5B"},
    {"id":"line","type":"color","label":"Lines","default":"#CBC8C1"},
    {"id":"accent","type":"color","label":"Accent","default":"#F9B336"},
    {"id":"onAccent","type":"color","label":"Text on the accent","default":"#1E1E1E"},
    {"id":"fontDisplay","type":"string","label":"Heading font","default":"Inter"},
    {"id":"fontBody","type":"string","label":"Body font","default":"Inter"},
    {"id":"fontLabel","type":"string","label":"Label font","default":"JetBrains Mono"},
    {"id":"radius","type":"string","label":"Corner rounding","default":"16px"},
    {"id":"ease","type":"string","label":"Ease for moves (GSAP)","default":"power3.inOut"}
  ]'
>
  <head>
    <meta charset="utf-8" />
    <title>W03 Stat · Wyzowl Video Studio</title>
    <!-- For the studio's library; HyperFrames ignores everything outside the template. -->
    <script type="application/json" id="studio-item">
      {
        "code": "W03",
        "name": "Stat",
        "category": "widgets",
        "free": true,
        "summary": "One number the presenter is talking about, with its source.",
        "use": "When the presenter quotes a figure. Every number carries its source, and it holds long enough to read twice.",
        "backdrop": "presenter",
        "motion": "The card rises 24 px and fades in (0.40 s). The marker scales in and the line draws down (0.90 s) while the number counts up from zero (1.00 s, easing out); the label and source fade up as the count settles. Out: the words fade (0.20 s), then the card drops 24 px and fades (0.30 s).",
        "preview": {}
      }
    </script>
  </head>
  <body>
    <template>
      <style>
        #w03-stat {
          position: absolute;
          inset: 0;
          overflow: hidden;
          pointer-events: none;
        }
        #w03-stat .place {
          position: absolute;
          inset: 0;
          display: flex;
          box-sizing: border-box;
        }
        #w03-stat[data-fmt="16x9"] .place { align-items: center; padding: 0 120px; }
        #w03-stat[data-fmt="1x1"] .place,
        #w03-stat[data-fmt="4x5"] .place { align-items: flex-end; padding: 64px; }
        /* 9:16 keeps clear of the platform's captions (bottom 440 px) and buttons (right 196 px) */
        #w03-stat[data-fmt="9x16"] .place { align-items: flex-end; padding: 0 0 440px 64px; }
        #w03-stat[data-side="right"]:not([data-fmt="9x16"]) .place { justify-content: flex-end; }
        #w03-stat .card {
          box-sizing: border-box;
          width: 600px;
          display: flex;
          flex-direction: column;
          gap: 28px;
          padding: 40px 40px 36px;
          background: var(--card, #f6f3ea);
          border-radius: var(--radius, 16px);
          color: var(--ink, #1e1e1e);
          overflow-wrap: anywhere;
          -webkit-font-smoothing: antialiased;
        }
        #w03-stat[data-fmt="1x1"] .card,
        #w03-stat[data-fmt="4x5"] .card { width: 700px; }
        #w03-stat[data-fmt="9x16"] .card { width: 820px; }
        #w03-stat .stat {
          position: relative;
          display: flex;
          flex-direction: column;
          gap: 10px;
          padding: 24px 0 0 32px;
        }
        #w03-stat .rule {
          position: absolute;
          left: 0;
          top: 0;
          bottom: 0;
          width: 2px;
          background: var(--accent, #f9b336);
        }
        #w03-stat .marker {
          position: absolute;
          left: -7px;
          top: 0;
          width: 16px;
          height: 16px;
          background: var(--accent, #f9b336);
        }
        #w03-stat .figure { display: flex; align-items: flex-start; }
        #w03-stat .num {
          font-family: var(--fontDisplay, "Inter"), system-ui, sans-serif;
          font-size: 150px;
          font-weight: 600;
          line-height: 150px;
          letter-spacing: -0.02em;
          font-variant-numeric: tabular-nums;
          white-space: nowrap;
        }
        #w03-stat .unit {
          padding: 8px 0 0 6px;
          font-family: var(--fontDisplay, "Inter"), system-ui, sans-serif;
          font-size: 68px;
          font-weight: 600;
          line-height: 74px;
          white-space: nowrap;
        }
        #w03-stat .label {
          font-family: var(--fontBody, "Inter"), system-ui, sans-serif;
          font-size: 30px;
          font-weight: 500;
          line-height: 40px;
          letter-spacing: -0.01em;
        }
        #w03-stat .compare {
          font-family: var(--fontBody, "Inter"), system-ui, sans-serif;
          font-size: 24px;
          font-weight: 500;
          line-height: 32px;
          color: var(--muted, #5f5e5b);
        }
        #w03-stat .source {
          padding-top: 18px;
          border-top: 2px dashed var(--line, #cbc8c1);
          font-family: var(--fontLabel, "JetBrains Mono"), ui-monospace, "SF Mono", Menlo, monospace;
          font-size: 18px;
          line-height: 24px;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: var(--muted, #5f5e5b);
        }
      </style>

      <div id="w03-stat" data-composition-id="w03-stat">
        <div class="place">
          <div class="card">
            <div class="stat">
              <div class="rule"></div>
              <div class="figure"><div class="num"></div><div class="unit"></div></div>
              <div class="label"></div>
              <div class="compare"></div>
              <div class="marker"></div>
            </div>
            <div class="source"></div>
          </div>
        </div>
      </div>

      <script>
        (() => {
          const ID = "w03-stat";
          const root = document.getElementById(ID);
          const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
          const v = (k, d) => (vars[k] === undefined || vars[k] === null ? d : vars[k]);
          // the frame's size: the clip's own data-width and data-height in a video (its layout isn't settled when this
          // runs), or the page's in the library's previews
          const host = root.parentElement && root.parentElement.closest("[data-width][data-height]");
          const W = Number(host && host.getAttribute("data-width")) || root.offsetWidth || 1920;
          const H = Number(host && host.getAttribute("data-height")) || root.offsetHeight || 1080;
          const r = W / H;
          root.dataset.fmt = r > 1.5 ? "16x9" : r > 0.9 ? "1x1" : r > 0.7 ? "4x5" : "9x16";
          root.dataset.side = v("side", "left") === "right" ? "right" : "left";

          const EASE = v("ease", "power3.inOut") || "power3.inOut";
          const D = Math.max(2, Number(v("duration", 6)) || 6);
          const q = (s) => root.querySelector(s);
          const card = q(".card");
          const num = q(".num");
          const unit = q(".unit");
          const label = q(".label");
          const compare = q(".compare");
          const source = q(".source");
          unit.textContent = String(v("unit", "%"));
          label.textContent = String(v("label", ""));
          compare.textContent = String(v("comparison", ""));
          source.textContent = String(v("source", ""));
          for (const el of [unit, label, compare, source]) if (!el.textContent.trim()) el.style.display = "none";

          // "48", "4,000", "2.5", "$1.2" → what comes before and after the digits, the value, its decimals and commas
          const raw = String(v("number", "48")).trim();
          const m = /^([^\d-]*)(-?[\d,]*\.?\d+)(.*)$/.exec(raw);
          const value = m ? Number(m[2].replace(/,/g, "")) : NaN;
          const decimals = m && m[2].includes(".") ? m[2].split(".")[1].length : 0;
          const commas = Boolean(m && m[2].includes(","));
          const digits = new Intl.NumberFormat("en-US", { minimumFractionDigits: decimals, maximumFractionDigits: decimals, useGrouping: commas });
          const before = m ? m[1] : "";
          const after = m ? m[3] : "";
          const shown = m ? before + digits.format(Number.isFinite(value) ? value : 0) + after : raw;
          num.textContent = shown;
          // the count: a value the timeline tweens, written into the number on each frame (nothing is measured)
          const count = { n: 0 };

          // the number keeps its final width while it counts (in tabular figures, so measured as zeros), so nothing beside
          // it moves. Measured off a canvas, as HyperFrames recommends: until its start a clip is hidden and measures as zero
          function hold() {
            const pen = document.createElement("canvas").getContext("2d");
            pen.font = `600 150px ${String(v("fontDisplay", "Inter") || "Inter")}, system-ui, sans-serif`;
            pen.letterSpacing = "-3px";
            num.style.minWidth = `${Math.ceil(pen.measureText(shown.replace(/\d/g, "0")).width) + 2}px`;
          }

          function build() {
            const tl = gsap.timeline({ paused: true });
            tl.fromTo(card, { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: EASE }, 0);
            tl.fromTo(q(".marker"), { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(1.7)" }, 0.3);
            tl.fromTo(q(".rule"), { scaleY: 0, transformOrigin: "50% 0%" }, { scaleY: 1, duration: 0.9, ease: EASE }, 0.3);
            if (Number.isFinite(value)) {
              tl.fromTo(count, { n: 0 }, { n: value, duration: 1, ease: "power2.out", onUpdate: () => (num.textContent = before + digits.format(count.n) + after) }, 0.35);
            }
            tl.fromTo(num, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 0.35);
            tl.fromTo(unit, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, 0.5);
            tl.fromTo([label, compare, source], { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: EASE, stagger: 0.1 }, 1.05);
            const out = D - 0.5;
            tl.to(card.children, { opacity: 0, duration: 0.2, ease: "none" }, out);
            tl.to(card, { y: 24, opacity: 0, duration: 0.3, ease: EASE }, out + 0.1);
            tl.set({}, {}, D);
            window.__timelines[ID] = tl;
          }

          // the number's width is measured, so build once the fonts have loaded
          const fonts = [`600 150px ${v("fontDisplay", "Inter") || "Inter"}`, `500 30px ${v("fontBody", "Inter") || "Inter"}`];
          const loaded = document.fonts ? Promise.all(fonts.map((f) => document.fonts.load(f).catch(() => null))).then(() => document.fonts.ready) : Promise.resolve();
          loaded.then(() => {
            hold();
            build();
          });
        })();
      </script>
    </template>
  </body>
</html>
